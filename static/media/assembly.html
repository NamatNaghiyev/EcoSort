<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EcoSort — 3D quruluş</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f1;color:#26332c;font:14px system-ui,sans-serif}
canvas{display:block;width:100%;height:420px;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
.bar{padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px solid #dce1d9;background:#fff}
button{border:1px solid #cdd5cc;background:#fff;color:#26332c;padding:8px 12px;border-radius:6px;cursor:pointer}
button:focus-visible,canvas:focus-visible{outline:2px solid #245a3b;outline-offset:-3px}
#status{margin-right:auto}small{display:block;padding:0 16px 12px;background:white;color:#58635b}
@media(max-width:600px){canvas{height:340px}}
</style></head><body>
<canvas id="scene" tabindex="0" aria-label="EcoSort konveyeri və ReflexGrip-in interaktiv 3D modeli. Ox düymələri ilə fırladın, artı və mənfi ilə yaxınlaşdırın."></canvas>
<div class="bar"><span id="status" role="status">3D model yüklənir…</span><button id="zoom-in" aria-label="Yaxınlaşdır">＋</button><button id="zoom-out" aria-label="Uzaqlaşdır">−</button><button id="reset">Görünüşü sıfırla</button></div>
<small>Sürüklə: fırlat · Siçan çarxı / iki barmaq: yaxınlaşdır · Klaviatura: oxlar, + / −</small>
<script src="model-geometry.js"></script><script src="assembly-viewer.js"></script>
</body></html>
